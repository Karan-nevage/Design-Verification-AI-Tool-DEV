name: RTL Bug Report
description: Report a functional or timing failure in the RTL design
title: "[RTL BUG]: "
labels: ["bug", "rtl"]
body:
  - type: markdown
    attributes:
      value: "## RTL Bug Report\nPlease provide the exact simulation details and traces to help fix this issue efficiently."

  - type: dropdown
    id: module
    attributes:
      label: Failing Module
      options:
        - AXI Interconnect
        - Asynchronous FIFO
        - Single-port RAM
        - Other
    validations:
      required: true

  - type: input
    id: rtl-version
    attributes:
      label: RTL Version / Git Commit
      description: "Which exact version of the RTL were you simulating?"
      placeholder: "e.g., commit hash 1a2b3c4"
    validations:
      required: true

  - type: input
    id: testcase
    attributes:
      label: Failing Testcase Name
      placeholder: "e.g., axi_burst_write_test"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Failure Description
      description: "Explain what is failing. What was the expected behavior vs. actual behavior?"
      placeholder: "Expected the FIFO full flag to assert, but it remained low..."
    validations:
      required: true

  - type: textarea
    id: traces
    attributes:
      label: Waveform / Trace Path
      description: "Paste the server path to the waveform database or attach screenshots of the tracing tool."
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (Blocks further verification)
        - Major (Functional failure)
        - Minor (Cosmetic/Documentation)
    validations:
      required: true
