name: RiReTech Netra Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master DNA
        uses: actions/checkout@v4

      - name: Install Toolchain
        run: |
          sudo apt-get update
          # Install core tools
          sudo apt-get install -y iverilog make

          # Install Verible Linter (Silicon-proven style checks)
          echo "Downloading Verible binaries..."
          wget -q https://github.com/chipsalliance/verible/releases/download/v0.0-3622-g07b310a3/verible-v0.0-3622-g07b310a3-Ubuntu-22.04-jammy-x86_64.tar.gz
          tar -xzf verible-*.tar.gz
          sudo cp verible-*/bin/verible-verilog-lint /usr/local/bin/
          verible-verilog-lint --version
          
      - name: Setup Environment & Run Style Law (Linting)
        run: |
          chmod +x scripts/*.sh
          source scripts/set_env.sh
          make lint

      - name: Run Integration Tests (Sanity Check)
        run: |
          source scripts/set_env.sh
          make check

      - name: Run Full Simulation Regression
        run: |
          source scripts/set_env.sh
          make sim
