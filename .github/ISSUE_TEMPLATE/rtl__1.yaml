name: Update RTL Dropdown(github action)

on:
  push:
    paths:
      - 'rtl/**' # Only run when files in the rtl folder change

jobs:
  update-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run update script
        run: python .github/scripts/update_dropdown.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/ISSUE_TEMPLATE/rtl_bug_report.yml
          git commit -m "chore: auto-update RTL module dropdown" || echo "No changes to commit"
          git push
